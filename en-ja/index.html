<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3画面同時ポップアップ検索</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #e9ecef;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 400px;
            text-align: center;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #218838; }
        p { font-size: 12px; color: #666; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>一括ポップアップ検索</h2>
    <input type="text" id="word" placeholder="検索したい単語を入力" onkeypress="if(event.key === 'Enter') openWindows()">
    <button onclick="openWindows()">3画面同時に開く</button>
    <p>※ブロックされた場合はアドレスバー右側の通知から「許可」してください。</p>
</div>

<script>
    function openWindows() {
        const word = document.getElementById('word').value;
        if (!word) return;

        const encoded = encodeURIComponent(word);
        
        // 画面のサイズを取得
        const screenW = window.screen.availWidth;
        const screenH = window.screen.availHeight;
        
        // 1つあたりのウィンドウ幅（3分割）
        const winW = Math.floor(screenW / 3);
        const winH = screenH;

        // URLリスト
        const urls = [
            `https://ejje.weblio.jp/content/${encoded}`,
            `https://www.ei-navi.jp/dictionary/ja_en/${encoded}`,
            `https://www.deepl.com/ja/translator#ja/en/${encoded}`
        ];

        // 各ウィンドウを位置をずらして開く
        urls.forEach((url, i) => {
            const leftPos = i * winW;
            window.open(
                url, 
                `window_${i}`, 
                `width=${winW},height=${winH},left=${leftPos},top=0,resizable=yes,scrollbars=yes`
            );
        });
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一括検索ツール</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        h1 { font-size: 1.5rem; color: #333; margin-bottom: 1.5rem; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus { border-color: #007bff; }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #0056b3; }
        .note {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>一括辞書検索</h1>
    <input type="text" id="keyword" placeholder="検索ワードを入力..." onkeypress="if(event.key === 'Enter') multiOpen()">
    <button onclick="multiOpen()">3つのサイトを開く</button>
    <div class="note">※初回実行時にブラウザの「ポップアップブロック」の解除が必要です</div>
</div>

<script>
    function multiOpen() {
        const input = document.getElementById('keyword').value;
        if (!input) return;

        // URLエンコード
        const encoded = encodeURIComponent(input);

        // 各URLの作成
        const urls = [
            `https://ejje.weblio.jp/content/${encoded}`,
            `https://eow.alc.co.jp/search?q=${encoded}`,
            `https://www.deepl.com/ja/translator#ja/en/${encoded}`
        ];

        // 各URLを新しいタブで開く
        urls.forEach(url => {
            window.open(url, '_blank');
        });
    }
</script>

</body>
</html>
